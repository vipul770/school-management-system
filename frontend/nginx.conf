limit_req_zone $binary_remote_addr zone=api_rate:10m rate=100r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ { limit_req zone=api_rate burst=20 nodelay; client_max_body_size 20M; proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /admin/ { proxy_pass http://backend:8000/admin/; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
