services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sms}
      POSTGRES_USER: ${POSTGRES_USER:-sms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sms} -d ${POSTGRES_DB:-sms}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECURE_SSL_REDIRECT: "false"
      SECURE_COOKIES: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-sms}
      REDIS_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  celery:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECURE_SSL_REDIRECT: "false"
      SECURE_COOKIES: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-sms}
      REDIS_URL: redis://redis:6379/0
    command: celery -A config worker -l info
    depends_on: [backend, redis]
  celery-beat:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECURE_SSL_REDIRECT: "false"
      SECURE_COOKIES: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-sms}
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat -l info
    depends_on: [backend, redis]
  nginx:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  postgres_data:
